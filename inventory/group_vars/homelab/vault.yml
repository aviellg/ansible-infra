---
vault_bootstrap_admin_user: "aviel"
vault_apps_admin_user: "aviel"
vault_apps_domainname: "example.com"

# --- proxmox ---------------------------------------------------------------
# RETRIEVE hostname or IP of the Proxmox node, no scheme, no port
vault_proxmox_api_host: "pve.example.com"
vault_proxmox_api_user: "root@pam"
# RETRIEVE Proxmox root password, or better an API token secret
vault_proxmox_api_password: ""
vault_proxmox_ssh_user: "root"
# RETRIEVE only needed if the proxmox role falls back to password SSH
vault_proxmox_ssh_pass: ""

# --- cloudflare / traefik --------------------------------------------------
# RETRIEVE scoped token: Zone:DNS:Edit on the zone above. Not the global key.
vault_apps_cloudflare_dns_api_token: ""
# CHOOSE   basic-auth pair for the traefik middleware
vault_apps_http_username: "aviel"
# GENERATE openssl rand -base64 24
vault_apps_http_password: ""

# --- authentik -------------------------------------------------------------
# GENERATE openssl rand -base64 36 — rotating this invalidates all sessions
vault_apps_authentik_secret_key: ""
# CHOOSE   postgres role and db for authentik
vault_apps_authentik_pg_user: "authentik"
vault_apps_authentik_pg_name: "authentik"
# GENERATE openssl rand -base64 24
vault_apps_authentik_pg_password: ""

# --- nextcloud -------------------------------------------------------------
# GENERATE openssl rand -base64 24
vault_apps_nextcloud_db_root_password: ""
vault_apps_nextcloud_db_password: ""
# CHOOSE   first admin account in the Nextcloud web UI
vault_apps_nextcloud_admin_user: "aviel"
# GENERATE openssl rand -base64 24
vault_apps_nextcloud_admin_password: ""

# --- smb / truenas ---------------------------------------------------------
# RETRIEVE the SMB account the docker cifs volumes mount with
vault_apps_smb_username: ""
vault_apps_smb_password: ""

# --- gamepanel (optional) --------------------------------------------------
vault_apps_gamepanel_db_password: ""
vault_apps_gamepanel_db_root_password: ""
vault_apps_gamepanel_email: ""
vault_apps_gamepanel_mail_password: ""
vault_apps_game_db_password: ""
vault_apps_game_db_root_password: ""
