---
# Host-specific. What runs HERE.
# Service definitions live in roles/ansible-role-apps/services/

USERDIR: "/home/{{ bootstrap_admin_user }}"
DOCKERDIR: "/home/{{ bootstrap_admin_user }}/docker"
HOSTNAME: "prod-app"

vm_name: prod-app
vm_cores: 8
vm_memory: 16384
vm_disk_size: 120
vm_ip: "192.168.14.54"
vm_gateway: "192.168.14.1"
vm_dns: "192.168.14.6"

# Order matters — dependencies deploy first.
enabled_apps:
  - socket-proxy
  - traefik
  - authentik
  - portainer
  - it-tools
  - cloudflare-ddns
  - backrest
#  - nextcloud
