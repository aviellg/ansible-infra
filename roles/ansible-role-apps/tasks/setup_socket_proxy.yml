---
- name: Socket proxy - Detect environment and set privileged mode
  tags: docker_privileged_mode
  block:
    - name: Detect if running inside a container
      ansible.builtin.set_fact:
        apps_is_container: >-
          {{ (ansible_virtualization_type | default('') in ['docker', 'lxc', 'container']) and
             (ansible_virtualization_role | default('') == 'guest') }}

    - name: Set docker_privileged_mode based on environment
      ansible.builtin.set_fact:
        apps_docker_privileged_mode: "{{ 'false' if apps_is_container else 'true' }}"
