---
- name: Nextcloud - Reset and directory setup
  tags:
    - nextcloud
  block:
    - name: Stop and remove Nextcloud compose stack (if present)
      community.docker.docker_compose_v2:
        project_src: "{{ apps_dockerdir }}"
        files:
          - "{{ apps_dockerdir }}/docker-compose.nextcloud.yml"
        state: absent
      when: apps_nextcloud_reset | default(false)
      ignore_errors: true # noqa: ignore-errors
      tags:
        - nextcloud_reset

    - name: Ensure any remaining Nextcloud containers are removed (best-effort)
      community.docker.docker_container:
        name: "{{ item }}"
        state: absent
        force_kill: true
      loop:
        - nextcloud-app
        - nextcloud-db
      when: apps_nextcloud_reset | default(false)
      ignore_errors: true # noqa: ignore-errors
      tags:
        - nextcloud_reset

    - name: Remove Nextcloud appdata directory
      become: true
      ansible.builtin.file:
        path: "{{ apps_dockerdir }}/appdata/nextcloud"
        state: absent
      when: apps_nextcloud_reset | default(false)
      tags:
        - nextcloud_reset

    - name: Create Nextcloud directories with correct permissions
      become: true
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner | default(apps_admin_user) }}"
        group: "{{ item.group | default(apps_admin_user) }}"
        mode: "{{ item.mode | default('0775') }}"
      loop:
        - { path: "{{ apps_dockerdir }}/appdata/nextcloud/config", mode: "0775" }
        - { path: "{{ apps_dockerdir }}/appdata/nextcloud/data", mode: "0775" }
        - { path: "{{ apps_dockerdir }}/appdata/nextcloud/db", mode: "0775" }
      tags:
        - directories
