---
# Full path: provision VM -> bootstrap OS -> deploy applications.
# For application changes only, use apps.yml.

- name: Provision VMs on Proxmox
  hosts: localhost
  gather_facts: false
  roles:
    - role: ansible-role-proxmox-vm
  tags: [provision]

- name: Bootstrap operating system
  hosts: app_servers
  gather_facts: true
  become: true
  roles:
    - role: ansible-role-setup
    - role: devsec.hardening.os_hardening
    - role: devsec.hardening.ssh_hardening
  tags: [os]

- name: Install container runtime
  hosts: app_servers
  gather_facts: true
  become: true
  roles:
    - role: geerlingguy.docker
    - role: geerlingguy.pip
  tags: [docker]

- name: Deploy applications
  hosts: app_servers
  gather_facts: true
  roles:
    - role: ansible-role-apps
  tags: [apps]
